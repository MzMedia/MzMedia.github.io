<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="aBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="aTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <marker id="aArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="aArrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="920" height="460" rx="16" fill="url(#aBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="230" y="18" width="460" height="34" rx="17" fill="#1e293b" stroke="url(#aTitle)" stroke-width="1.5"/>
  <text x="460" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    现代设施温室：水肥环控自愈与作物病害 AI 视觉巡检
  </text>

  <!-- Left: Greenhouse Perception -->
  <g transform="translate(35, 75)">
    <rect width="230" height="345" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="115" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">【温室多参感知与巡检】</text>

    <rect x="20" y="50" width="190" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">土壤水肥四合一传感器</text>
    <text x="35" y="93" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 含水量 (%) / 温度 / EC / pH</text>
    <text x="35" y="107" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 测量根系基质微环境</text>

    <rect x="20" y="125" width="190" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">顶棚微气象站 &amp; 光照仪</text>
    <text x="35" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 光照 Lux / CO2 ppm / 空气温湿度</text>
    <text x="35" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 4G / LoRaWAN 无线低功耗回传</text>

    <rect x="20" y="200" width="190" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="225" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">桁架巡航高清球机</text>
    <text x="35" y="243" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 定时巡检各垄草莓/番茄冠层</text>
    <text x="35" y="257" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 宏观长势与微距叶片抓拍</text>

    <rect x="20" y="275" width="190" height="50" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="115" y="305" font-family="system-ui, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">农业专用 TSL 物模型归一化</text>
  </g>

  <!-- Arrow Left to Center -->
  <line x1="265" y1="240" x2="310" y2="240" stroke="#10b981" stroke-width="2" marker-end="url(#aArrowGreen)"/>
  <text x="288" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">物联上报</text>

  <!-- Center: Climate Self-Healing & AI Diagnosis -->
  <g transform="translate(310, 75)">
    <rect width="270" height="345" rx="10" fill="#0f172a" stroke="#84cc16" stroke-width="1.5"/>
    <text x="135" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#a3e635" text-anchor="middle">【自适应微气候引擎与植保 AI】</text>

    <rect x="20" y="50" width="230" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a3e635">TCA 环控自愈逻辑</text>
    <text x="35" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 温度&gt;32℃ &amp; 强光 ➔ 开遮阳网/天窗</text>
    <text x="35" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 土壤水分&lt;35% ➔ 启动脉冲滴灌</text>
    <text x="35" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 达到 65% 阈值毫秒自停</text>

    <rect x="20" y="150" width="230" height="90" rx="6" fill="#1e293b" stroke="#8b5cf6"/>
    <text x="35" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#c084fc">Spring AI 植保多模态大模型</text>
    <text x="35" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#e9d5ff">· 白粉病/灰霉病早期菌丝识别</text>
    <text x="35" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#e9d5ff">· 准确率达 94.2%，提前 3~5 天</text>
    <text x="35" y="228" font-family="system-ui, sans-serif" font-size="10" fill="#a855f7">· 输出低毒生物农药配比指导</text>

    <rect x="20" y="250" width="230" height="75" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">农艺专家规则沉淀</text>
    <text x="35" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 结合天气预报提前拉幕保温</text>
    <text x="35" y="312" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 避免倒春寒冻害造成大面积绝收</text>
  </g>

  <!-- Arrow Center to Right -->
  <line x1="580" y1="240" x2="625" y2="240" stroke="#84cc16" stroke-width="2" marker-end="url(#aArrowGreen)"/>
  <text x="602" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#bef264" text-anchor="middle">反控闭环</text>

  <!-- Right: Field Actuators & Yield Benefits -->
  <g transform="translate(625, 75)">
    <rect width="260" height="345" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">【执行机构反控与成效】</text>

    <rect x="20" y="50" width="220" height="85" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399">环控电机毫秒反控</text>
    <text x="35" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· Modbus 写入继电器启闭天窗</text>
    <text x="35" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 开启轴流风机与湿帘降温</text>
    <text x="35" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 驱动水肥一体机比例施肥泵</text>

    <rect x="20" y="150" width="220" height="85" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a3e635">农技专家移动控制台</text>
    <text x="35" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 手机端一键切换自动/手动模式</text>
    <text x="35" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 实时观看各栋温室低延迟直播</text>
    <text x="35" y="228" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 告警与病害配方卡片即时推送</text>

    <rect x="20" y="250" width="220" height="75" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">量化产出效益</text>
    <text x="35" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 节水 32%、节肥 25%</text>
    <text x="35" y="312" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 优质果品率由 68% 提至 89.5%</text>
  </g>
</svg>
