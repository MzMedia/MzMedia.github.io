<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="vArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="vGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="vAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="920" height="460" rx="16" fill="url(#vBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="250" y="18" width="420" height="34" rx="17" fill="#1e293b" stroke="url(#blueGlow)" stroke-width="1.5"/>
  <text x="460" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    变电站/仓储：传感器超限秒级驱动球机转动预置位链路
  </text>

  <!-- Step 1: Trigger -->
  <g transform="translate(35, 75)">
    <rect width="180" height="150" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f87171" text-anchor="middle">步骤 1: 异常感知</text>
    <circle cx="90" cy="65" r="22" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="71" font-size="20" text-anchor="middle">🔥</text>
    <text x="90" y="105" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">变压器母排温度 82℃</text>
    <text x="90" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Modbus RTU 上报越限</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="215" y1="150" x2="265" y2="150" stroke="#ef4444" stroke-width="2" marker-end="url(#vAmber)"/>
  <text x="240" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">10ms</text>

  <!-- Step 2: TCA Engine -->
  <g transform="translate(265, 75)">
    <rect width="200" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">步骤 2: TCA 规则匹配</text>
    <rect x="20" y="48" width="160" height="26" rx="4" fill="#1e293b"/>
    <text x="100" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Trigger: 属性上报</text>
    <rect x="20" y="80" width="160" height="26" rx="4" fill="#1e293b"/>
    <text x="100" y="97" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Cond: temp &gt; 75℃</text>
    <text x="100" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">发布 LinkageEvent</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="465" y1="150" x2="515" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#vArrow)"/>
  <text x="490" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">5ms</text>

  <!-- Step 3: PTZ Actuation & ZLM -->
  <g transform="translate(515, 75)">
    <rect width="190" height="150" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="95" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#a5b4fc" text-anchor="middle">步骤 3: 球机调焦抓拍</text>
    <circle cx="95" cy="65" r="22" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-width="1.5"/>
    <text x="95" y="71" font-size="20" text-anchor="middle">📹</text>
    <text x="95" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">SIP 0x81 指令 (预置位4)</text>
    <text x="95" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">光学变倍10x + 录像切片</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="705" y1="150" x2="745" y2="150" stroke="#818cf8" stroke-width="2" marker-end="url(#vArrow)"/>

  <!-- Step 4: AI Audit -->
  <g transform="translate(745, 75)">
    <rect width="140" height="150" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fcd34d" text-anchor="middle">步骤 4: AI 复核</text>
    <circle cx="70" cy="65" r="22" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="71" font-size="20" text-anchor="middle">🤖</text>
    <text x="70" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Spring AI 视觉判别</text>
    <text x="70" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#fef08a" text-anchor="middle">过滤水汽/反光</text>
  </g>

  <!-- Bottom Result Box: 1.8s Realtime Visual Verification -->
  <g transform="translate(35, 260)">
    <rect width="850" height="165" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#34d399">
      【最终成效：1.8 秒全链路触达中控与移动端】
    </text>

    <!-- Sub Card A: Screen Popup -->
    <rect x="30" y="55" width="250" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="45" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f1f5f9">🖥️ 中控大屏实时弹窗</text>
    <text x="45" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">· Jessibuca WebRTC 低延时播放</text>
    <text x="45" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">· 延迟 &lt; 300ms，现场画音同步</text>

    <!-- Sub Card B: Mobile Dispatch -->
    <rect x="300" y="55" width="250" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="315" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f1f5f9">📱 企微/钉钉图文卡片</text>
    <text x="315" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">· 内嵌 4K 抓拍缩略图与温度值</text>
    <text x="315" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">· 一键唤醒点播实时监控流</text>

    <!-- Sub Card C: MES Evidence -->
    <rect x="570" y="55" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="585" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f1f5f9">💾 证据链与 MES 工单归档</text>
    <text x="585" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">· 自动保存告警前10秒+后50秒录像</text>
    <text x="585" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">· 派发维保工单并锁定 WMS 绝缘件备件</text>
  </g>
</svg>
