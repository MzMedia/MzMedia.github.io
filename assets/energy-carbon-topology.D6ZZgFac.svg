<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="nBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="nTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="nArrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="nArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="920" height="460" rx="16" fill="url(#nBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="230" y="18" width="460" height="34" rx="17" fill="#1e293b" stroke="url(#nTitle)" stroke-width="1.5"/>
  <text x="460" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    智慧能源与微电网：工商业储能削峰填谷与需量柔性自适应
  </text>

  <!-- Left: Grid & Power Elements -->
  <g transform="translate(35, 75)">
    <rect width="230" height="345" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="115" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">【配电与新能源微电网】</text>

    <rect x="20" y="50" width="190" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">高低压配电进线柜</text>
    <text x="35" y="93" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 三相电压/电流/有功功率 (kW)</text>
    <text x="35" y="107" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 变压器容量实时负荷率监测</text>

    <rect x="20" y="125" width="190" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">屋顶分布式光伏逆变器</text>
    <text x="35" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 400kW 发电功率与 MPPT 状态</text>
    <text x="35" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 日照辐射度预测联动</text>

    <rect x="20" y="200" width="190" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="225" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399">1MWh 工商业储能系统</text>
    <text x="35" y="243" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· PCS 变流器 / BMS 电池簇</text>
    <text x="35" y="257" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 0.5C 充放电率，SOC 状态监控</text>

    <rect x="20" y="275" width="190" height="50" rx="6" fill="#451a03" stroke="#f59e0b"/>
    <text x="115" y="305" font-family="system-ui, sans-serif" font-size="11" fill="#fed7aa" text-anchor="middle">Modbus TCP 502 / RS485 组网</text>
  </g>

  <!-- Flow Arrow Left to Center -->
  <line x1="265" y1="240" x2="310" y2="240" stroke="#f59e0b" stroke-width="2" marker-end="url(#nArrowAmber)"/>
  <text x="288" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">遥测</text>

  <!-- Center: MzMedia Demand & Energy AI -->
  <g transform="translate(310, 75)">
    <rect width="270" height="345" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="135" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">【需量越限预测与 AI 充放排程】</text>

    <rect x="20" y="50" width="230" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399">两级需量防越限削峰</text>
    <text x="35" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 一级 (负荷&gt;85%): 储能最大放电</text>
    <text x="35" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 二级 (负荷&gt;90%): 空调柔性升温</text>
    <text x="35" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 杜绝变压器超限 2 倍电费罚款</text>

    <rect x="20" y="150" width="230" height="90" rx="6" fill="#1e293b" stroke="#8b5cf6"/>
    <text x="35" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#c084fc">Spring AI 储能充放电动态调度</text>
    <text x="35" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#e9d5ff">· 结合当地分时电价 (峰平谷尖)</text>
    <text x="35" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#e9d5ff">· 结合天气预报测算光伏就地消纳</text>
    <text x="35" y="228" font-family="system-ui, sans-serif" font-size="10" fill="#a855f7">· 输出“两充两放”动态套利排程</text>

    <rect x="20" y="250" width="230" height="75" rx="6" fill="#1e293b" stroke="#ef4444"/>
    <text x="35" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f87171">双光谱红外热成像联动</text>
    <text x="35" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 定时扫描母排触头 (超70℃报警)</text>
    <text x="35" y="312" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 镜头打位投送中控大屏</text>
  </g>

  <!-- Flow Arrow Center to Right -->
  <line x1="580" y1="240" x2="625" y2="240" stroke="#10b981" stroke-width="2" marker-end="url(#nArrowGreen)"/>
  <text x="602" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">下行</text>

  <!-- Right: HVAC & Cost Savings -->
  <g transform="translate(625, 75)">
    <rect width="260" height="345" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">【柔性执行与经济效益】</text>

    <rect x="20" y="50" width="220" height="85" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">中央空调 VRV 楼控网关</text>
    <text x="35" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 柔性平滑微调出风设定 1~1.5℃</text>
    <text x="35" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 保证体感舒适同时削减 15% 负荷</text>
    <text x="35" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 下班自动进入休眠节能模式</text>

    <rect x="20" y="150" width="220" height="85" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#10b981">综合电费降低 19.4%</text>
    <text x="35" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 储能动态套利年收益 38 万元</text>
    <text x="35" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 空调节电年节约 24 万元</text>
    <text x="35" y="228" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 每年直接节电成本超 62 万元</text>

    <rect x="20" y="250" width="220" height="75" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">变压器超需量罚款清零</text>
    <text x="35" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">· 光伏就地消纳率提升至 99.2%</text>
    <text x="35" y="312" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">· 清洁绿电使用占比达 33.5%</text>
  </g>
</svg>
